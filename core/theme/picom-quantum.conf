# --- Backend Engine (Hardware Accelerated GLX / Fallback XRender) ---
backend = "glx";
glx-no-stencil = true;
glx-copy-from-front = false;
glx-no-rebind-pixmap = false;
vsync = true;
use-damage = false;
xrender-sync-fence = false;
unredir-if-possible = false;

# --- Universal Glass Opacity & Translucency Matrix ---
inactive-opacity = 1.0;
active-opacity = 1.0;
frame-opacity = 1.0;
inactive-opacity-override = false;

focus-exclude = [
  "class_g = 'flowork-apk-com.worldance.drama'",
  "class_g = 'flowork-apk-com.lemon.lvoverseas'",
  "class_g ^= 'flowork-apk-'",
  "class_g = 'Emulator'",
  "class_g = 'qemu-system-x86_64'",
  "class_g = 'flowork-studio'",
  "class_g = 'Flowork-Studio'",
  "class_g = 'google-chrome'",
  "class_g = 'Google-chrome'",
  "class_g = 'FloworkClickOverlay'",
  "name = 'FloworkClickOverlay'"
];

opacity-rule = [
  "100:class_g = 'FloworkClickOverlay'",
  "100:name = 'FloworkClickOverlay'",
  "100:class_g ^= 'flowork-apk-'",
  "100:class_g = 'Emulator'",
