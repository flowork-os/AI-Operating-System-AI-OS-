# --- Native Hardware Spring Animations (Quantum Spring-Zoom) ---
# Note: Animations disabled to prevent offscreen FBO zoom-buffer invalidation on NVIDIA 595+ drivers
animations = false;
animation-stiffness-in-tag = 260.0;
animation-stiffness-tag-change = 260.0;
animation-window-mass = 0.50;
animation-dampening = 22.0;
animation-clamping = false;

animation-for-open-window = "none";
animation-for-unmap-window = "none";
animation-for-transient-window = "none";

# --- Fluid Fade Physics ---
# Note: Fading disabled to eliminate alpha blending FBO stalls during rapid window restacking
fading = false;
fade-in-step = 0.050;
fade-out-step = 0.050;
fade-delta = 5;
no-fading-openclose = true;
fade-exclude = [
  "class_g = 'MuelleGenieLaunch'",
  "class_g = 'MuelleGenieClose'",
  "class_g = 'Flowork-Muelle-Dock'",
  "class_g = 'flowork-muelle-dock'",
  "class_g = 'slop'",
  "class_g = 'Slop'"
];

wintypes:
{
  tooltip = { fade = true; shadow = true; opacity = 1.0; focus = true; full-shadow = false; };
  dock = { shadow = false; clip-shadow-above = true; };
  dnd = { shadow = false; };
  popup_menu = { opacity = 1.0; shadow = true; fade = false; };
  dropdown_menu = { opacity = 1.0; shadow = true; fade = false; };
  menu = { opacity = 1.0; shadow = true; fade = false; };
  dialog = { opacity = 1.0; shadow = true; fade = false; };
  modal = { opacity = 1.0; shadow = true; fade = false; };
  normal = { opacity = 1.0; shadow = true; fade = false; };
};
